# Railway's edge redirects http to https but sends no HSTS of its own, and
# Moodle has no setting for it. Declared at server level: nothing in this image
# sets add_header inside a location, so nothing inherits its way out of these.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
