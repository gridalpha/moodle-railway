# Railway's health check runs anonymously and its path may contain only letters,
# digits and "/" — which rules out every meaningful Moodle route, since they all
# end in .php. This exact-match location outranks the regex PHP location above
# and runs a script that lives outside the Moodle tree, so a code sync cannot
# remove it.
location = /healthz {
    access_log off;
    fastcgi_pass unix:/run/php-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /usr/local/lib/railway-healthz.php;
    fastcgi_param SCRIPT_NAME /healthz;
    include fastcgi_params;
}
