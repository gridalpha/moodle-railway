; Production PHP settings for Moodle. The base image ships the opcache
; extension but no tuning, and Moodle is the workload opcache was made for:
; ~15k PHP files compiled on every request without it.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
; Moodle reads PHPDoc blocks at runtime, so comments must survive compilation.
opcache.save_comments = 1
